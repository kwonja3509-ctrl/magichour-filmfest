            </div>
            <div class="admin-calendar-grid" data-admin-calendar></div>
            <div class="admin-calendar-legend" data-calendar-legend></div>
          </div>

          <div class="admin-schedule-filter" data-schedule-filter>
            <button type="button" class="admin-schedule-filter-btn active" data-cat="all">전체</button>
            <button type="button" class="admin-schedule-filter-btn" data-cat="홍보">홍보</button>
